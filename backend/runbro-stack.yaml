        Variables:
          RUNBRO_GARMIN_BUCKET: !Ref RunbroGarminBucket
          RUNBRO_TOKEN_KEY_ID: !GetAtt RunbroTokenKey.Arn
          KAKAO_APP_ID: !Ref KakaoAppId
          USER_HMAC_SECRET: !Ref UserHmacSecret
      Code:
        S3Bucket: !Ref GarminCodeBucket
        S3Key: !Ref GarminCodeKey

  RunbroApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-http-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
