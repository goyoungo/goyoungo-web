          function validChatgptRedirect(value) {
            try {
              const url = new URL(String(value || ""));
              return (
                url.protocol === "https:" &&
                url.hostname === "chatgpt.com" &&
                !url.port &&
                !url.username &&
                !url.password &&
                (
                  url.pathname.startsWith("/connector/oauth/") ||
                  url.pathname === "/connector_platform_oauth_redirect"
                )
              );
            } catch (error) {
