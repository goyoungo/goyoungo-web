AWSTemplateFormatVersion: "2010-09-09"
Description: Secure Garmin sync and direct Codex analysis pipeline for GO.YOUNGO RUNBRO

Parameters:
  KakaoAppId:
    Type: String
    Default: "1470643"
    AllowedPattern: "^[0-9]+$"
    Description: Numeric Kakao application ID expected in verified access tokens
  UserHmacSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random secret used to pseudonymize Kakao user IDs
  OAuthStateSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random secret used to sign short-lived OAuth state values
  StravaClientId:
    Type: String
    Default: ""
    Description: Strava API application client ID
  StravaClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Strava API application client secret
  GarminCodeBucket:
    Type: String
    Default: ""
    Description: S3 bucket containing the packaged RUNBRO Garmin Lambda code
  GarminCodeKey:
    Type: String
    Default: ""
    Description: S3 key containing the packaged RUNBRO Garmin Lambda zip
  AnalysisCodeBucket:
    Type: String
    Description: S3 bucket containing the packaged RUNBRO analysis worker code
  AnalysisCodeKey:
    Type: String
    Description: S3 key containing the packaged RUNBRO analysis worker zip
  CodexImageUri:
    Type: String
    Description: ECR image URI for the RUNBRO Codex analysis Lambda
  CodexAuthKey:
    Type: String
    Default: "system/codex/auth.json"
    AllowedPattern: "^system/codex/[A-Za-z0-9._/-]+$"
    Description: Private S3 object key containing the file-backed Codex auth cache

Conditions:
  GarminCodeProvided: !And
    - !Not [!Equals [!Ref GarminCodeBucket, ""]]
    - !Not [!Equals [!Ref GarminCodeKey, ""]]

Resources:
  RunbroTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-data"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: goyoungo
        - Key: Purpose
          Value: runbro-personal-running-data

  RunbroTokenKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts RUNBRO external provider tokens
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  RunbroTokenKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-tokens"
      TargetKeyId: !Ref RunbroTokenKey

  RunbroGarminBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt RunbroTokenKey.Arn
      LifecycleConfiguration:
        Rules:
          - Id: RemoveIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: RemoveOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: RemoveOldCodexAuthVersions
            Status: Enabled
            Prefix: "system/codex/"
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: RemoveAbandonedEphemeralObjects
            Status: Enabled
            TagFilters:
              - Key: DataClass
                Value: ephemeral
            ExpirationInDays: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Application
          Value: goyoungo
        - Key: Purpose
          Value: runbro-encrypted-garmin-data

  RunbroGarminBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RunbroGarminBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt RunbroGarminBucket.Arn
              - !Sub "${RunbroGarminBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  RunbroCodexDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-codex-dlq.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true

  RunbroCodexQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-codex.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 3600
      VisibilityTimeout: 3600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RunbroCodexDeadLetterQueue.Arn
        maxReceiveCount: 3

  RunbroAnalysisResultDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-analysis-result-dlq.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true

  RunbroAnalysisResultQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-analysis-result.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 3600
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RunbroAnalysisResultDeadLetterQueue.Arn
        maxReceiveCount: 3

  RunbroFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunbroDataAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchWriteItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !GetAtt RunbroTable.Arn
              - Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                Resource: !GetAtt RunbroTokenKey.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "${RunbroGarminBucket.Arn}/users/*/garmin/activities/latest.json.gz"
                  - !Sub "${RunbroGarminBucket.Arn}/users/*/garmin/health/latest.json.gz"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt RunbroCodexQueue.Arn
        - PolicyName: RunbroLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-api:*"

  RunbroFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 14

  RunbroFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - RunbroFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Description: RUNBRO profile, privacy-preserving analysis and ChatGPT MCP OAuth
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: index.handler
      MemorySize: 256
      Timeout: 28
      ReservedConcurrentExecutions: 15
      Role: !GetAtt RunbroFunctionRole.Arn
      Environment:
        Variables:
          RUNBRO_TABLE_NAME: !Ref RunbroTable
          RUNBRO_TOKEN_KEY_ID: !GetAtt RunbroTokenKey.Arn
          KAKAO_APP_ID: !Ref KakaoAppId
          USER_HMAC_SECRET: !Ref UserHmacSecret
          OAUTH_STATE_SECRET: !Ref OAuthStateSecret
          STRAVA_CLIENT_ID: !Ref StravaClientId
          STRAVA_CLIENT_SECRET: !Ref StravaClientSecret
          RUNBRO_GARMIN_BUCKET: !Ref RunbroGarminBucket
          RUNBRO_ANALYSIS_QUEUE_URL: !Ref RunbroCodexQueue
      Code:
        ZipFile: |
          "use strict";

          const crypto = require("node:crypto");
          const zlib = require("node:zlib");
          const { DynamoDBClient } = require("@aws-sdk/client-dynamodb");
          const {
            DynamoDBDocumentClient,
            BatchWriteCommand,
            DeleteCommand,
            GetCommand,
            PutCommand,
            QueryCommand
          } = require("@aws-sdk/lib-dynamodb");
          const {
            S3Client,
            GetObjectCommand
          } = require("@aws-sdk/client-s3");
          const {
            KMSClient,
            EncryptCommand,
            DecryptCommand
          } = require("@aws-sdk/client-kms");
          const {
            SQSClient,
            SendMessageCommand
          } = require("@aws-sdk/client-sqs");

          const tableName = process.env.RUNBRO_TABLE_NAME;
          const tokenKeyId = process.env.RUNBRO_TOKEN_KEY_ID;
          const kakaoAppId = String(process.env.KAKAO_APP_ID || "");
          const userHmacSecret = process.env.USER_HMAC_SECRET || "";
          const oauthStateSecret = process.env.OAUTH_STATE_SECRET || "";
          const stravaClientId = String(process.env.STRAVA_CLIENT_ID || "");
          const stravaClientSecret = process.env.STRAVA_CLIENT_SECRET || "";
          const garminBucket = process.env.RUNBRO_GARMIN_BUCKET || "";
          const analysisQueueUrl = process.env.RUNBRO_ANALYSIS_QUEUE_URL || "";
          const callbackUrl = "https://goyoungo.com/runbro/callback.html";
          const chatgptConsentUrl = "https://goyoungo.com/runbro/chatgpt-connect.html";
          const mcpScopes = new Set(["running:read", "analysis:write"]);
          const allowedOrigins = new Set([
            "https://goyoungo.com",
            "https://www.goyoungo.com",
            "https://test.goyoungo.com"
          ]);

          if (
            !tableName ||
            !tokenKeyId ||
            !/^\d+$/.test(kakaoAppId) ||
            userHmacSecret.length < 32 ||
            oauthStateSecret.length < 32
          ) {
            throw new Error("RUNBRO API configuration is invalid.");
          }

          const documentClient = DynamoDBDocumentClient.from(
            new DynamoDBClient({}),
            { marshallOptions: { removeUndefinedValues: true } }
          );
          const kmsClient = new KMSClient({});
          const s3Client = new S3Client({});
          const sqsClient = new SQSClient({});

          class HttpError extends Error {
            constructor(statusCode, message, code) {
              super(message);
              this.statusCode = statusCode;
              this.code = code;
            }
          }

          function response(statusCode, body) {
            return {
              statusCode,
              headers: {
                "content-type": "application/json; charset=utf-8",
                "cache-control": "no-store",
                "x-content-type-options": "nosniff",
                "referrer-policy": "no-referrer"
              },
              body: JSON.stringify(body)
            };
          }

          function redirectResponse(location) {
            return {
              statusCode: 302,
              headers: {
                location,
                "cache-control": "no-store",
                "x-content-type-options": "nosniff",
                "referrer-policy": "no-referrer"
              },
              body: ""
            };
          }

          function emptyResponse(statusCode) {
            return {
              statusCode,
              headers: {
                "cache-control": "no-store",
                "x-content-type-options": "nosniff"
              },
              body: ""
            };
          }

          function requestOrigin(event) {
            const domain = String(
              event.requestContext && event.requestContext.domainName || ""
            );
            if (!/^[A-Za-z0-9.-]+$/.test(domain)) {
              throw new HttpError(400, "요청 주소를 확인하지 못했습니다.", "invalid_request_origin");
            }
            return "https://" + domain;
          }

          function rawRequestBody(event, maxBytes) {
            const source = event.isBase64Encoded
              ? Buffer.from(event.body || "", "base64").toString("utf8")
              : (event.body || "");
            if (Buffer.byteLength(source, "utf8") > maxBytes) {
              throw new HttpError(413, "요청 내용이 너무 큽니다.", "payload_too_large");
            }
            return source;
          }

          function parseFormBody(event, maxBytes) {
            return new URLSearchParams(rawRequestBody(event, maxBytes));
          }

          function parseBody(event, maxBytes) {
            const source = rawRequestBody(event, maxBytes);
            try {
              const body = JSON.parse(source || "{}");
              if (!body || Array.isArray(body) || typeof body !== "object") throw new Error("object required");
              return body;
            } catch (error) {
              throw new HttpError(400, "요청 형식이 올바르지 않습니다.", "invalid_json");
            }
          }

          function bearerToken(event) {
            const value = (event.headers && (event.headers.authorization || event.headers.Authorization)) || "";
            const match = /^Bearer\s+(\S+)$/i.exec(value);
            if (!match || match[1].length < 20 || match[1].length > 2048) {
              throw new HttpError(401, "카카오 로그인이 필요합니다.", "login_required");
            }
            return match[1];
          }

          async function verifyKakaoUser(event) {
            const token = bearerToken(event);
            let kakaoResponse;
            try {
              kakaoResponse = await fetch("https://kapi.kakao.com/v1/user/access_token_info", {
                headers: { Authorization: "Bearer " + token },
                signal: AbortSignal.timeout(4500)
              });
            } catch (error) {
              throw new HttpError(503, "카카오 인증 서버에 연결하지 못했습니다.", "auth_unavailable");
            }
            const source = await kakaoResponse.text();
            let tokenInfo;
            try {
              tokenInfo = JSON.parse(source);
            } catch (error) {
              throw new HttpError(503, "카카오 인증 응답을 확인하지 못했습니다.", "auth_unavailable");
            }
            if (!kakaoResponse.ok) {
              throw new HttpError(401, "카카오 로그인이 만료되었습니다.", "login_expired");
            }
            const numericId = /"id"\s*:\s*(\d+)/.exec(source);
            const kakaoUserId = numericId ? numericId[1] : null;
            if (
              String(tokenInfo.app_id || "") !== kakaoAppId ||
              Number(tokenInfo.expires_in || 0) <= 0 ||
              !kakaoUserId
            ) {
              throw new HttpError(401, "이 서비스에서 발급한 로그인이 아닙니다.", "invalid_login");
            }
            const hash = crypto
              .createHmac("sha256", userHmacSecret)
              .update(kakaoAppId + ":" + kakaoUserId)
              .digest("hex");
            return "USER#" + hash;
          }

          function signState(payload) {
            const encoded = Buffer.from(JSON.stringify(payload)).toString("base64url");
            const signature = crypto
              .createHmac("sha256", oauthStateSecret)
              .update(encoded)
              .digest("base64url");
            return encoded + "." + signature;
          }

          function verifyState(value) {
            const parts = String(value || "").split(".");
            if (parts.length !== 2 || parts[0].length > 2048 || parts[1].length > 128) {
              throw new HttpError(400, "연결 정보가 올바르지 않습니다.", "invalid_oauth_state");
            }
            const expected = crypto
              .createHmac("sha256", oauthStateSecret)
              .update(parts[0])
              .digest();
            let provided;
            try {
              provided = Buffer.from(parts[1], "base64url");
            } catch (error) {
              throw new HttpError(400, "연결 정보가 올바르지 않습니다.", "invalid_oauth_state");
            }
            if (provided.length !== expected.length || !crypto.timingSafeEqual(provided, expected)) {
              throw new HttpError(400, "연결 정보가 올바르지 않습니다.", "invalid_oauth_state");
            }
            let payload;
            try {
              payload = JSON.parse(Buffer.from(parts[0], "base64url").toString("utf8"));
            } catch (error) {
              throw new HttpError(400, "연결 정보가 올바르지 않습니다.", "invalid_oauth_state");
            }
            if (
              !payload ||
              payload.provider !== "strava" ||
              !/^USER#[a-f0-9]{64}$/.test(payload.userPk || "") ||
              Number(payload.expiresAt || 0) < Date.now()
            ) {
              throw new HttpError(400, "연결 요청이 만료되었습니다. 다시 시도해 주세요.", "expired_oauth_state");
            }
            return payload;
          }

          function signMcpPayload(payload) {
            const encoded = Buffer.from(JSON.stringify(payload)).toString("base64url");
            const signature = crypto
              .createHmac("sha256", oauthStateSecret)
              .update("runbro-mcp:" + encoded)
              .digest("base64url");
            return encoded + "." + signature;
          }

          function verifyMcpPayload(value, expectedKind) {
            const parts = String(value || "").split(".");
            if (parts.length !== 2 || parts[0].length > 6144 || parts[1].length > 128) {
              throw new HttpError(400, "ChatGPT 연결 요청이 올바르지 않습니다.", "invalid_oauth_request");
            }
            const expected = crypto
              .createHmac("sha256", oauthStateSecret)
              .update("runbro-mcp:" + parts[0])
              .digest();
            let provided;
            try {
              provided = Buffer.from(parts[1], "base64url");
            } catch (error) {
              throw new HttpError(400, "ChatGPT 연결 요청이 올바르지 않습니다.", "invalid_oauth_request");
            }
            if (provided.length !== expected.length || !crypto.timingSafeEqual(provided, expected)) {
              throw new HttpError(400, "ChatGPT 연결 요청이 올바르지 않습니다.", "invalid_oauth_request");
            }
            let payload;
            try {
              payload = JSON.parse(Buffer.from(parts[0], "base64url").toString("utf8"));
            } catch (error) {
              throw new HttpError(400, "ChatGPT 연결 요청이 올바르지 않습니다.", "invalid_oauth_request");
            }
            if (
              !payload ||
              payload.kind !== expectedKind ||
              Number(payload.expiresAt || 0) < Date.now()
            ) {
              throw new HttpError(400, "ChatGPT 연결 요청이 만료되었습니다.", "expired_oauth_request");
            }
            return payload;
          }

          function tokenHash(value) {
            return crypto.createHash("sha256").update(String(value || "")).digest("hex");
          }

          function normalizedScopes(value) {
            const scopes = String(value || "")
              .split(/\s+/)
              .filter((scope) => mcpScopes.has(scope));
            return Array.from(new Set(scopes));
          }

          async function encryptTokens(userPk, provider, value) {
            const result = await kmsClient.send(new EncryptCommand({
              KeyId: tokenKeyId,
              Plaintext: Buffer.from(JSON.stringify(value), "utf8"),
              EncryptionContext: { userPk, provider }
            }));
            return Buffer.from(result.CiphertextBlob).toString("base64");
          }

          async function decryptTokens(userPk, provider, ciphertext) {
            const result = await kmsClient.send(new DecryptCommand({
              CiphertextBlob: Buffer.from(ciphertext, "base64"),
              EncryptionContext: { userPk, provider }
            }));
            return JSON.parse(Buffer.from(result.Plaintext).toString("utf8"));
          }

          function validateProfile(body) {
            const raceName = String(body.raceName || "").trim();
            const raceDate = String(body.raceDate || "");
            const distanceKm = Number(body.distanceKm);
            const goalTimeSeconds = body.goalTimeSeconds == null ? null : Number(body.goalTimeSeconds);
            const daysPerWeek = Number(body.daysPerWeek || 4);
            if (
              raceName.length < 1 ||
              raceName.length > 60 ||
              !/^\d{4}-\d{2}-\d{2}$/.test(raceDate) ||
              new Date(raceDate + "T23:59:59Z").getTime() < Date.now() ||
              new Date(raceDate + "T00:00:00Z").getTime() > Date.now() + 3 * 365 * 86400000 ||
              !Number.isFinite(distanceKm) ||
              distanceKm < 1 ||
              distanceKm > 250 ||
              (goalTimeSeconds != null && (!Number.isFinite(goalTimeSeconds) || goalTimeSeconds < 300 || goalTimeSeconds > 252000)) ||
              !Number.isInteger(daysPerWeek) ||
              daysPerWeek < 1 ||
              daysPerWeek > 7
            ) {
              throw new HttpError(400, "목표 레이스 정보를 확인해 주세요.", "invalid_profile");
            }
            return {
              raceName,
              raceDate,
              distanceKm,
              goalTimeSeconds,
              daysPerWeek
            };
          }

          async function queryUserItems(userPk) {
            const items = [];
            let lastKey;
            do {
              const result = await documentClient.send(new QueryCommand({
                TableName: tableName,
                KeyConditionExpression: "pk = :pk",
                ExpressionAttributeValues: { ":pk": userPk },
                ExclusiveStartKey: lastKey,
                Limit: 100
              }));
              items.push(...(result.Items || []));
              lastKey = result.LastEvaluatedKey;
            } while (lastKey && items.length < 500);
            return items;
          }

          function publicDashboard(items) {
            const profileItem = items.find((item) => item.sk === "PROFILE");
            const analysisItem = items.find((item) => item.sk === "ANALYSIS");
            const latestAnalysisJob = items
              .filter((item) => item.sk.startsWith("ANALYSIS_JOB#"))
              .sort((a, b) => String(b.requestedAt || "").localeCompare(String(a.requestedAt || "")))[0];
            const connections = {};
            const activities = [];
            for (const item of items) {
              if (item.sk === "CONNECTION#STRAVA") {
                connections.strava = {
                  connected: true,
                  lastSyncAt: item.lastSyncAt || null,
                  scope: item.scope || ""
                };
              } else if (item.sk === "CONNECTION#GARMIN") {
                connections.garmin = {
                  connected: true,
                  lastSyncAt: item.lastSyncAt || null
                };
              } else if (item.sk.startsWith("ACTIVITY#")) {
                activities.push({
                  id: item.providerActivityId,
                  provider: item.provider,
                  date: item.date,
                  name: item.name,
                  distanceKm: item.distanceKm,
                  movingSeconds: item.movingSeconds,
                  elapsedSeconds: item.elapsedSeconds,
                  elevationGain: item.elevationGain,
                  averageHr: item.averageHr,
                  maxHr: item.maxHr
                });
              }
            }
            activities.sort((a, b) => new Date(b.date) - new Date(a.date));
            return {
              profile: profileItem ? profileItem.profile : null,
              connections,
              activities: activities.slice(0, 120),
              analysis: analysisItem && analysisItem.analysis ? analysisItem.analysis : null,
              analysisJob: latestAnalysisJob ? {
                jobId: latestAnalysisJob.sk.slice("ANALYSIS_JOB#".length),
                status: latestAnalysisJob.status,
                errorCode: latestAnalysisJob.errorCode || null,
                requestedAt: latestAnalysisJob.requestedAt || null,
                updatedAt: latestAnalysisJob.updatedAt || null,
                completedAt: latestAnalysisJob.completedAt || null
              } : null
            };
          }

          async function dashboardFor(userPk) {
            return publicDashboard(await queryUserItems(userPk));
          }

          function garminObjectKey(userPk, suffix) {
            if (!/^USER#[a-f0-9]{64}$/.test(userPk)) {
              throw new HttpError(401, "RUNBRO 사용자 연결을 확인해 주세요.", "invalid_user");
            }
            return "users/" + userPk.slice(5) + "/garmin/" + suffix;
          }

          async function readGarminJson(userPk, suffix) {
            if (!garminBucket) return null;
            try {
              const result = await s3Client.send(new GetObjectCommand({
                Bucket: garminBucket,
                Key: garminObjectKey(userPk, suffix)
              }));
              const bytes = Buffer.from(await result.Body.transformToByteArray());
              const plain = result.ContentEncoding === "gzip" || (bytes[0] === 31 && bytes[1] === 139)
                ? zlib.gunzipSync(bytes)
                : bytes;
              if (plain.length > 2 * 1024 * 1024) return null;
              return JSON.parse(plain.toString("utf8"));
            } catch (error) {
              const code = String(error && (error.name || error.Code) || "");
              if (["NoSuchKey", "NotFound", "404"].includes(code)) return null;
              console.error("RUNBRO Garmin summary read failed", { name: code });
              return null;
            }
          }

          async function combinedDashboardFor(userPk) {
            const [base, garminActivities, garminHealth] = await Promise.all([
              dashboardFor(userPk),
              readGarminJson(userPk, "activities/latest.json.gz"),
              readGarminJson(userPk, "health/latest.json.gz")
            ]);
            const activities = []
              .concat(base.activities || [])
              .concat(garminActivities && Array.isArray(garminActivities.activities)
                ? garminActivities.activities
                : []);
            const seen = new Set();
            base.activities = activities.filter((activity) => {
              const key = String(activity.provider || "unknown") + ":" + String(activity.id || "");
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            }).sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 120);
            base.health = garminHealth && garminHealth.summary
              ? garminHealth.summary
              : null;
            return base;
          }

          async function putProfile(event) {
            const userPk = await verifyKakaoUser(event);
            const profile = validateProfile(parseBody(event, 2048));
            await documentClient.send(new PutCommand({
              TableName: tableName,
              Item: {
                pk: userPk,
                sk: "PROFILE",
                profile,
                updatedAt: new Date().toISOString()
              }
            }));
            return response(200, { profile });
          }

          async function startOAuth(event, provider) {
            const userPk = await verifyKakaoUser(event);
            parseBody(event, 512);
            if (provider === "garmin") {
              throw new HttpError(
                503,
                "Garmin Connect 개발자 프로그램 승인 후 직접 연결할 수 있습니다.",
                "provider_not_configured"
              );
            }
            if (provider !== "strava" || !/^\d+$/.test(stravaClientId) || stravaClientSecret.length < 8) {
              throw new HttpError(503, "Strava 앱 연결 설정이 필요합니다.", "provider_not_configured");
            }
            const state = signState({
              provider: "strava",
              userPk,
              nonce: crypto.randomBytes(18).toString("base64url"),
              expiresAt: Date.now() + 10 * 60 * 1000
            });
            const authorize = new URL("https://www.strava.com/oauth/authorize");
            authorize.searchParams.set("client_id", stravaClientId);
            authorize.searchParams.set("redirect_uri", callbackUrl);
            authorize.searchParams.set("response_type", "code");
            authorize.searchParams.set("approval_prompt", "auto");
            authorize.searchParams.set("scope", "read,activity:read_all");
            authorize.searchParams.set("state", state);
            return response(200, { authorizationUrl: authorize.toString() });
          }

          async function completeStravaOAuth(event) {
            const body = parseBody(event, 4096);
            const state = verifyState(body.state);
            if (!/^\d+$/.test(stravaClientId) || stravaClientSecret.length < 8) {
              throw new HttpError(503, "Strava 앱 연결 설정이 필요합니다.", "provider_not_configured");
            }
            const code = String(body.code || "");
            if (!/^[A-Za-z0-9_-]{8,512}$/.test(code)) {
              throw new HttpError(400, "Strava 연결 코드를 확인해 주세요.", "invalid_oauth_code");
            }
            const tokenBody = new URLSearchParams({
              client_id: stravaClientId,
              client_secret: stravaClientSecret,
              code,
              grant_type: "authorization_code"
            });
            let tokenResponse;
            try {
              tokenResponse = await fetch("https://www.strava.com/api/v3/oauth/token", {
                method: "POST",
                headers: { "content-type": "application/x-www-form-urlencoded" },
                body: tokenBody,
                signal: AbortSignal.timeout(7000)
              });
            } catch (error) {
              throw new HttpError(503, "Strava 연결 서버에 접속하지 못했습니다.", "provider_unavailable");
            }
            const tokenData = await tokenResponse.json().catch(() => ({}));
            if (
              !tokenResponse.ok ||
              !tokenData.access_token ||
              !tokenData.refresh_token ||
              !Number.isFinite(Number(tokenData.expires_at))
            ) {
              throw new HttpError(400, "Strava 연결을 완료하지 못했습니다.", "oauth_exchange_failed");
            }
            const grantedScope = String(tokenData.scope || body.scope || "");
            const grantedScopes = new Set(grantedScope.split(/[\s,]+/).filter(Boolean));
            if (!grantedScopes.has("activity:read") && !grantedScopes.has("activity:read_all")) {
              throw new HttpError(
                400,
                "러닝 기록 읽기 권한이 허용되지 않았습니다. 다시 연결해 주세요.",
                "activity_scope_required"
              );
            }
            const encryptedTokens = await encryptTokens(state.userPk, "strava", {
              accessToken: tokenData.access_token,
              refreshToken: tokenData.refresh_token,
              expiresAt: Number(tokenData.expires_at)
            });
            await documentClient.send(new PutCommand({
              TableName: tableName,
              Item: {
                pk: state.userPk,
                sk: "CONNECTION#STRAVA",
                provider: "strava",
                providerUserId: String(tokenData.athlete && tokenData.athlete.id || ""),
                scope: grantedScope,
                encryptedTokens,
                connectedAt: new Date().toISOString()
              }
            }));
            return response(200, { connected: true, provider: "strava" });
          }

          async function refreshStravaTokenIfNeeded(userPk, connection) {
            let tokens = await decryptTokens(userPk, "strava", connection.encryptedTokens);
            if (Number(tokens.expiresAt || 0) > Math.floor(Date.now() / 1000) + 3600) {
              return { tokens, encryptedTokens: connection.encryptedTokens };
            }
            const refreshBody = new URLSearchParams({
              client_id: stravaClientId,
              client_secret: stravaClientSecret,
              grant_type: "refresh_token",
              refresh_token: tokens.refreshToken
            });
            const result = await fetch("https://www.strava.com/api/v3/oauth/token", {
              method: "POST",
              headers: { "content-type": "application/x-www-form-urlencoded" },
              body: refreshBody,
              signal: AbortSignal.timeout(7000)
            });
            const refreshed = await result.json().catch(() => ({}));
            if (!result.ok || !refreshed.access_token || !refreshed.refresh_token) {
              throw new HttpError(401, "Strava 연결이 만료되었습니다. 다시 연결해 주세요.", "provider_login_expired");
            }
            tokens = {
              accessToken: refreshed.access_token,
              refreshToken: refreshed.refresh_token,
              expiresAt: Number(refreshed.expires_at)
            };
            return {
              tokens,
              encryptedTokens: await encryptTokens(userPk, "strava", tokens)
            };
          }

          async function syncStrava(userPk, connection) {
            const tokenState = await refreshStravaTokenIfNeeded(userPk, connection);
            const after = Math.floor((Date.now() - 120 * 86400000) / 1000);
            const activitiesUrl = new URL("https://www.strava.com/api/v3/athlete/activities");
            activitiesUrl.searchParams.set("after", String(after));
            activitiesUrl.searchParams.set("page", "1");
            activitiesUrl.searchParams.set("per_page", "100");
            let activitiesResponse;
            try {
              activitiesResponse = await fetch(activitiesUrl, {
                headers: { Authorization: "Bearer " + tokenState.tokens.accessToken },
                signal: AbortSignal.timeout(9000)
              });
            } catch (error) {
              throw new HttpError(503, "Strava 기록을 가져오지 못했습니다.", "provider_unavailable");
            }
            const providerActivities = await activitiesResponse.json().catch(() => []);
            if (!activitiesResponse.ok || !Array.isArray(providerActivities)) {
              throw new HttpError(502, "Strava 기록 응답을 확인하지 못했습니다.", "provider_error");
            }
            const runTypes = new Set(["Run", "TrailRun", "VirtualRun"]);
            const now = new Date().toISOString();
            const writes = providerActivities
              .filter((activity) => runTypes.has(String(activity.sport_type || activity.type || "")))
              .slice(0, 100)
              .map((activity) => {
                const date = String(activity.start_date || "");
                return {
                  PutRequest: {
                    Item: {
                      pk: userPk,
                      sk: "ACTIVITY#" + date + "#STRAVA#" + String(activity.id),
                      provider: "strava",
                      providerActivityId: String(activity.id),
                      date,
                      name: String(activity.name || "Strava 러닝").slice(0, 120),
                      distanceKm: Math.round(Number(activity.distance || 0)) / 1000,
                      movingSeconds: Number(activity.moving_time || 0),
                      elapsedSeconds: Number(activity.elapsed_time || 0),
                      elevationGain: Number(activity.total_elevation_gain || 0),
                      averageHr: activity.average_heartrate == null ? null : Number(activity.average_heartrate),
                      maxHr: activity.max_heartrate == null ? null : Number(activity.max_heartrate),
                      syncedAt: now
                    }
                  }
                };
              });
            for (let index = 0; index < writes.length; index += 25) {
              await documentClient.send(new BatchWriteCommand({
                RequestItems: { [tableName]: writes.slice(index, index + 25) }
              }));
            }
            await documentClient.send(new PutCommand({
              TableName: tableName,
              Item: {
                ...connection,
                encryptedTokens: tokenState.encryptedTokens,
                lastSyncAt: now
              }
            }));
            return writes.length;
          }

          async function syncActivities(event) {
            const userPk = await verifyKakaoUser(event);
            parseBody(event, 256);
            const items = await queryUserItems(userPk);
            const stravaConnection = items.find((item) => item.sk === "CONNECTION#STRAVA");
            if (!stravaConnection) {
              throw new HttpError(409, "먼저 Strava를 연결해 주세요.", "provider_not_connected");
            }
            await syncStrava(userPk, stravaConnection);
            return response(200, await dashboardFor(userPk));
          }

          function optionalAnalysisNumber(value, min, max, integer) {
            if (value == null) return null;
            if (
              typeof value !== "number" ||
              !Number.isFinite(value) ||
              value < min ||
              value > max ||
              (integer && !Number.isInteger(value))
            ) {
              throw new HttpError(400, "분석용 기록 요약을 확인해 주세요.", "invalid_analysis_input");
            }
            return value;
          }

          function validatedAnalysisInput(body) {
            if (!body.analysisInput) return null;
            const source = body.analysisInput;
            if (!source || Array.isArray(source) || typeof source !== "object") {
              throw new HttpError(400, "분석용 기록 요약을 확인해 주세요.", "invalid_analysis_input");
            }
            const weekly = source.weeklyDistanceKmOldestToNewest;
            if (!Array.isArray(weekly) || weekly.length !== 4) {
              throw new HttpError(400, "분석용 기록 요약을 확인해 주세요.", "invalid_analysis_input");
            }
            const healthSource = source.health;
            if (
              healthSource != null &&
              (!healthSource || Array.isArray(healthSource) || typeof healthSource !== "object")
            ) {
              throw new HttpError(400, "분석용 컨디션 요약을 확인해 주세요.", "invalid_analysis_input");
            }
            const runCount28Days = optionalAnalysisNumber(source.runCount28Days, 0, 100, true);
            const weeklyDistanceKmOldestToNewest = weekly.map((value) =>
              optionalAnalysisNumber(value, 0, 500, false)
            );
            if (
              runCount28Days == null ||
              weeklyDistanceKmOldestToNewest.some((value) => value == null)
            ) {
              throw new HttpError(400, "분석용 기록 요약을 확인해 주세요.", "invalid_analysis_input");
            }
            const runTypeSource = source.runTypeCounts;
            const runTypeCounts = {};
            if (runTypeSource != null) {
              if (!runTypeSource || Array.isArray(runTypeSource) || typeof runTypeSource !== "object") {
                throw new HttpError(400, "러닝 분류 요약을 확인해 주세요.", "invalid_analysis_input");
              }
              for (const key of ["interval", "tempo", "zone2", "long", "recovery"]) {
                runTypeCounts[key] = optionalAnalysisNumber(runTypeSource[key] || 0, 0, 100, true);
              }
            }
            const heartZoneMinutes = source.heartZoneMinutes;
            if (
              heartZoneMinutes != null &&
              (!Array.isArray(heartZoneMinutes) || heartZoneMinutes.length !== 5)
            ) {
              throw new HttpError(400, "심박존 요약을 확인해 주세요.", "invalid_analysis_input");
            }
            return {
              runCount28Days,
              weeklyDistanceKmOldestToNewest,
              averagePaceSecondsPerKm: optionalAnalysisNumber(
                source.averagePaceSecondsPerKm,
                120,
                3600,
                false
              ),
              averageHeartRateBpm: optionalAnalysisNumber(
                source.averageHeartRateBpm,
                30,
                230,
                false
              ),
              estimatedVdot: optionalAnalysisNumber(source.estimatedVdot, 15, 90, false),
              runTypeCounts: runTypeSource != null ? runTypeCounts : null,
              heartZoneMinutes: heartZoneMinutes == null
                ? null
                : heartZoneMinutes.map((value) =>
                    optionalAnalysisNumber(value, 0, 100000, true)
                  ),
              health: healthSource ? {
                sleepHours: optionalAnalysisNumber(healthSource.sleepHours, 0, 14, false),
                hrv: optionalAnalysisNumber(healthSource.hrv, 0, 300, false),
                restingHeartRate: optionalAnalysisNumber(
                  healthSource.restingHeartRate,
                  30,
                  160,
                  false
                ),
                trainingReadiness: optionalAnalysisNumber(
                  healthSource.trainingReadiness,
                  0,
                  100,
                  false
                )
              } : null
            };
          }

          function latestRunForAnalysis(activities, race) {
            const usable = (activities || []).filter((activity) => {
              const distance = Number(activity.distanceKm);
              const seconds = Number(activity.movingSeconds);
              return (
                Number.isFinite(new Date(activity.date).getTime()) &&
                Number.isFinite(distance) &&
                Number.isFinite(seconds) &&
                distance > 0 &&
                seconds > 0
              );
            }).sort((a, b) => new Date(b.date) - new Date(a.date));
            if (!usable.length) return null;
            const recent = usable.filter((activity) =>
              Date.now() - new Date(activity.date).getTime() <= 28 * 86400000
            );
            const comparison = recent.length ? recent : usable.slice(0, 8);
            const averageDistance = comparison.reduce(
              (sum, activity) => sum + Number(activity.distanceKm),
              0
            ) / comparison.length;
            const averagePace = comparison.reduce(
              (sum, activity) =>
                sum + Number(activity.movingSeconds) / Number(activity.distanceKm),
              0
            ) / comparison.length;
            const latest = usable[0];
            const distance = Number(latest.distanceKm);
            const movingSeconds = Number(latest.movingSeconds);
            const pace = movingSeconds / distance;
            const observedMaxHr = Math.max(
              0,
              ...comparison.map((activity) => {
                const maxHr = Number(activity.maxHr);
                const averageHr = Number(activity.averageHr);
                if (Number.isFinite(maxHr) && maxHr >= 120 && maxHr <= 230) return maxHr;
                if (Number.isFinite(averageHr) && averageHr >= 100 && averageHr <= 210) {
                  return averageHr + 12;
                }
                return 0;
              })
            );
            const latestAverageHr = Number(latest.averageHr);
            const heartRateRatio =
              observedMaxHr >= 140 &&
              Number.isFinite(latestAverageHr) &&
              latestAverageHr >= 30
                ? latestAverageHr / observedMaxHr
                : null;
            const heartRateIntensity = heartRateRatio == null
              ? "unavailable"
              : heartRateRatio >= 0.9
                ? "very_high"
                : heartRateRatio >= 0.8
                  ? "high"
                  : heartRateRatio >= 0.68
                    ? "moderate"
                    : "low";
            const paceDelta = Math.round(pace - averagePace);
            const distanceDeltaPercent = Math.round(
              (distance / Math.max(averageDistance, 0.1) - 1) * 100
            );
            let runType = "zone2";
            if (distance >= Math.max(12, averageDistance * 1.45)) {
              runType = "long";
            } else if (heartRateIntensity === "very_high" && paceDelta <= -20) {
              runType = "interval";
            } else if (
              ["high", "very_high"].includes(heartRateIntensity) ||
              paceDelta <= -15
            ) {
              runType = "tempo";
            } else if (heartRateIntensity === "low" || paceDelta >= 35) {
              runType = "recovery";
            }
            const goalPace =
              race &&
              Number(race.goalTimeSeconds) > 0 &&
              Number(race.distanceKm) > 0
                ? Number(race.goalTimeSeconds) / Number(race.distanceKm)
                : null;
            const previous = usable[1];
            return {
              date: String(latest.date).slice(0, 10),
              runType,
              distanceKm: Math.round(distance * 100) / 100,
              movingSeconds: Math.round(movingSeconds),
              elapsedSeconds: Number.isFinite(Number(latest.elapsedSeconds))
                ? Math.round(Number(latest.elapsedSeconds))
                : null,
              paceSecondsPerKm: Math.round(pace),
              paceDeltaSecondsVs28DayAverage: paceDelta,
              paceDeltaSecondsVsGoal: goalPace == null
                ? null
                : Math.round(pace - goalPace),
              distanceDeltaPercentVs28DayAverage: distanceDeltaPercent,
              elevationGainMeters: Number.isFinite(Number(latest.elevationGain))
                ? Math.max(0, Math.round(Number(latest.elevationGain)))
                : null,
              averageHeartRateBpm: Number.isFinite(latestAverageHr)
                ? Math.round(latestAverageHr)
                : null,
              maxHeartRateBpm: Number.isFinite(Number(latest.maxHr))
                ? Math.round(Number(latest.maxHr))
                : null,
              heartRateIntensity,
              heartRateAvailable: heartRateIntensity !== "unavailable",
              daysSincePreviousRun: previous
                ? Math.max(
                    0,
                    Math.round(
                      (new Date(latest.date).getTime() -
                        new Date(previous.date).getTime()) / 86400000
                    )
                  )
                : null
            };
          }

          function recentRunsForAnalysis(activities) {
            const now = Date.now();
            const runs = (activities || []).filter((activity) => {
              const date = new Date(activity.date);
              const distance = Number(activity.distanceKm);
              const movingSeconds = Number(activity.movingSeconds);
              const age = Math.floor((now - date.getTime()) / 86400000);
              return (
                Number.isFinite(date.getTime()) &&
                age >= 0 &&
                age < 84 &&
                Number.isFinite(distance) &&
                distance > 0 &&
                Number.isFinite(movingSeconds) &&
                movingSeconds > 0
              );
            }).sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 60);
            return runs.map((activity, index) => {
              const distance = Number(activity.distanceKm);
              const movingSeconds = Number(activity.movingSeconds);
              const previous = runs[index + 1];
              const numberOrNull = (value, min, max) => {
                const parsed = Number(value);
                return Number.isFinite(parsed) && parsed >= min && parsed <= max
                  ? parsed
                  : null;
              };
              return {
                date: String(activity.date).slice(0, 10),
                distanceKm: Math.round(distance * 100) / 100,
                movingSeconds: Math.round(movingSeconds),
                elapsedSeconds: numberOrNull(activity.elapsedSeconds, movingSeconds, 172800),
                paceSecondsPerKm: Math.round(movingSeconds / distance),
                elevationGainMeters: numberOrNull(activity.elevationGain, 0, 20000),
                averageHeartRateBpm: numberOrNull(activity.averageHr, 30, 230),
                maxHeartRateBpm: numberOrNull(activity.maxHr, 30, 240),
                daysSincePreviousRun: previous
                  ? Math.max(
                      0,
                      Math.round(
                        (new Date(activity.date).getTime() -
                          new Date(previous.date).getTime()) / 86400000
                      )
                    )
                  : null
              };
            });
          }

          function aggregateForAnalysis(dashboard) {
            const now = Date.now();
            const race = dashboard.profile ? {
              date: dashboard.profile.raceDate,
              distanceKm: dashboard.profile.distanceKm,
              goalTimeSeconds: dashboard.profile.goalTimeSeconds,
              daysPerWeek: dashboard.profile.daysPerWeek
            } : null;
            const recentRuns = recentRunsForAnalysis(dashboard.activities);
            const snapshot = mcpRunningSnapshot(dashboard, 84);
            const runCount28Days = recentRuns.filter((activity) => {
              const age = Math.floor((now - new Date(activity.date).getTime()) / 86400000);
              return age >= 0 && age < 28;
            }).length;
            return {
              periodDays: 84,
              race,
              latestRun: latestRunForAnalysis(dashboard.activities, race),
              runCount28Days,
              totals: snapshot.totals,
              weeklyTrendOldestToNewest: snapshot.weeklyTrendOldestToNewest,
              automaticClassification: snapshot.automaticClassification,
              heartRateZones: snapshot.heartRateZones,
              recovery: snapshot.recovery,
              recentRuns,
              privacy:
                "No account ID, token, route, coordinates, activity title, or exact start time is included."
            };
          }

          async function analyze(event) {
            const userPk = await verifyKakaoUser(event);
            parseBody(event, 1024);
            const dashboard = await combinedDashboardFor(userPk);
            const activeJob = dashboard.analysisJob;
            if (
              activeJob &&
              ["queued", "codex_queued", "codex_processing"].includes(activeJob.status) &&
              Date.now() - new Date(activeJob.requestedAt || 0).getTime() < 15 * 60 * 1000
            ) {
              return response(202, { ...dashboard, analysisJob: activeJob });
            }
            const aggregate = aggregateForAnalysis(dashboard);
            if (!aggregate.race || !aggregate.latestRun || aggregate.runCount28Days < 2) {
              throw new HttpError(
                409,
                "목표 레이스와 최근 러닝 기록 2개 이상이 필요합니다.",
                "analysis_data_required"
              );
            }
            if (!analysisQueueUrl) {
              throw new HttpError(
                503,
                "분석 대기열을 준비하고 있습니다.",
                "analysis_queue_unavailable"
              );
            }
            const jobId = crypto.randomUUID();
            const requestedAt = new Date().toISOString();
            const ttl = Math.floor(Date.now() / 1000) + 86400;
            await documentClient.send(new PutCommand({
              TableName: tableName,
              Item: {
                pk: userPk,
                sk: "ANALYSIS_JOB#" + jobId,
                status: "queued",
                requestedAt,
                updatedAt: requestedAt,
                ttl
              }
            }));
            try {
              await sqsClient.send(new SendMessageCommand({
                QueueUrl: analysisQueueUrl,
                MessageBody: JSON.stringify({
                  userPk,
                  jobId,
                  aggregate
                }),
                MessageGroupId: userPk,
                MessageDeduplicationId: jobId
              }));
            } catch (error) {
              await documentClient.send(new PutCommand({
                TableName: tableName,
                Item: {
                  pk: userPk,
                  sk: "ANALYSIS_JOB#" + jobId,
                  status: "failed",
                  errorCode: "queue_submit_failed",
                  requestedAt,
                  updatedAt: new Date().toISOString(),
                  ttl
                }
              }));
              throw error;
            }
            return response(202, {
              ...dashboard,
              analysisJob: {
                jobId,
                status: "queued",
                errorCode: null,
                requestedAt,
                updatedAt: requestedAt,
                completedAt: null
              }
            });
          }

          async function analysisStatus(event, jobId) {
            const userPk = await verifyKakaoUser(event);
            if (!/^[a-f0-9-]{36}$/.test(jobId)) {
              throw new HttpError(400, "분석 작업 번호를 확인해 주세요.", "invalid_analysis_job");
            }
            const job = await getItem(userPk, "ANALYSIS_JOB#" + jobId);
            if (!job) {
              throw new HttpError(404, "분석 작업을 찾을 수 없습니다.", "analysis_job_not_found");
            }
            const dashboard = await dashboardFor(userPk);
            return response(200, {
              ...dashboard,
              analysisJob: {
                jobId,
                status: job.status,
                errorCode: job.errorCode || null,
                requestedAt: job.requestedAt || null,
                updatedAt: job.updatedAt || null,
                completedAt: job.completedAt || null
              }
            });
          }

          async function getItem(pk, sk) {
