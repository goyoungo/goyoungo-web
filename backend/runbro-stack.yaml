    Properties:
      ApiId: !Ref RunbroApi
      RouteKey: "POST /garmin/sync"
      Target: !Join
        - /
        - - integrations
          - !Ref RunbroGarminIntegration

  RunbroGarminDeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: GarminCodeProvided
    Properties:
      ApiId: !Ref RunbroApi
      RouteKey: "DELETE /garmin/account"
      Target: !Join
        - /
        - - integrations
          - !Ref RunbroGarminIntegration

  RunbroApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-http-api"
      RetentionInDays: 14

  RunbroStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref RunbroApi
      StageName: "$default"
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt RunbroApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","sourceIp":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 15
        ThrottlingRateLimit: 8

  RunbroInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RunbroFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RunbroApi}/*"

  RunbroGarminInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: GarminCodeProvided
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RunbroGarminFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RunbroApi}/*"

Outputs:
  ApiEndpoint:
    Description: Base URL for the RUNBRO API
    Value: !GetAtt RunbroApi.ApiEndpoint
  DataTableName:
    Description: DynamoDB table that stores pseudonymous profiles and running data
    Value: !Ref RunbroTable
  TokenKeyArn:
    Description: KMS key used to encrypt external provider OAuth tokens
    Value: !GetAtt RunbroTokenKey.Arn
  GarminBucketName:
    Description: SSE-KMS encrypted S3 bucket that stores Garmin tokens and normalized data
    Value: !Ref RunbroGarminBucket
