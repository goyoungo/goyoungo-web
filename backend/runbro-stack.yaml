    Properties:
      ApiId: !Ref RunbroApi
      RouteKey: "GET /garmin/dashboard"
      Target: !Join
        - /
        - - integrations
          - !Ref RunbroGarminIntegration

  RunbroGarminSyncRoute:
    Type: AWS::ApiGatewayV2::Route
