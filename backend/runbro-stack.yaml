          async function registerMcpClient(event) {
            const body = parseBody(event, 8192);
            const redirectUris = Array.isArray(body.redirect_uris)
              ? body.redirect_uris.map(String)
              : [];
            if (
              redirectUris.length < 1 ||
              redirectUris.length > 8 ||
              redirectUris.some((uri) => !validChatgptRedirect(uri))
            ) {
              throw new HttpError(400, "ChatGPT 콜백 주소를 확인해 주세요.", "invalid_redirect_uri");
            }
            const clientId = "runbro_client_" + crypto.randomBytes(24).toString("base64url");
            const client = {
              pk: "OAUTH#CLIENT#" + clientId,
              sk: "METADATA",
              clientId,
              clientName: String(body.client_name || "ChatGPT RUNBRO").slice(0, 100),
              redirectUris: Array.from(new Set(redirectUris)),
              createdAt: new Date().toISOString()
            };
            await documentClient.send(new PutCommand({
              TableName: tableName,
              Item: client,
              ConditionExpression: "attribute_not_exists(pk)"
            }));
            return response(201, {
              client_id: clientId,
              client_name: client.clientName,
              redirect_uris: client.redirectUris,
              token_endpoint_auth_method: "none",
              grant_types: ["authorization_code", "refresh_token"],
              response_types: ["code"]
            });
